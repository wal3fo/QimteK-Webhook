[build]
  command = "npm run build"
  publish = "dist"
  environment = { VITE_API_URL = "/api" }

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["better-sqlite3"]
  # Note: Environment variables in netlify.toml are build-time only.
  # For runtime environment variables, set them in Netlify UI:
  # Site settings > Build & deploy > Environment > Environment variables
  # Add: DB_PATH = /tmp/webhook-data.json (optional - code auto-detects serverless)

[dev]
  command = "npm run dev"
  port = 5173
  targetPort = 5173
  publish = "dist"
  # redirect all API calls to your local backend during dev
  [[dev.proxy]]
    path = "/api/*"
    url = "http://localhost:3003"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
